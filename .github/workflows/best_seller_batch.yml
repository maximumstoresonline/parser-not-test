name: Best Seller — поиск по списку

# Запускается кнопкой «Запустить поиск» на вкладке «Best Seller подкатегории → Список ASIN» (workflow_dispatch)
# или вручную из вкладки Actions. Берёт ASIN из очереди best_seller.searches (статус queued) и записывает
# результаты в базу. За прогон — не больше BS_BATCH_LIMIT ASIN (кредиты ScrapingDog).
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Сколько ASIN из очереди обработать за прогон"
        required: false
        default: "25"

concurrency:
  group: parser-not-test-best-seller-batch
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Поиск подкатегорий по очереди
        env:
          SCRAPINGDOG_TOKEN: ${{ secrets.SCRAPINGDOG_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BS_BATCH_LIMIT: ${{ inputs.limit }}
        run: python best_seller_batch.py
